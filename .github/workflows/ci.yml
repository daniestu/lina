name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Instalar (dependencias fijadas, como las recibe quien instala Lina)
        run: pip install --require-hashes -r packaging/requisitos.txt && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Rastros y secretos
        run: python scripts/comprobar_rastros.py
      - name: Pruebas (con cobertura)
        run: pytest --cov --cov-report=term

  tipos:
    name: Tipos (mypy, informativo)
    runs-on: ubuntu-latest
    # De momento no bloquea: sirve para ver cuántos avisos hay y bajarlos módulo a módulo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: mypy
        run: mypy

  familias:
    name: Núcleo en ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    container: ${{ matrix.imagen }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nombre: Arch, familia: arch, imagen: "archlinux:latest", preparar: "pacman -Syu --noconfirm --needed python python-pip gcc portaudio sudo git"}
          - {nombre: Debian, familia: debian, imagen: "debian:stable", preparar: "apt-get update && apt-get install -y python3 python3-venv python3-pip python3-dev build-essential libportaudio2 sudo git"}
          # Fedora 45 trae Python 3.15, para el que aún no hay todas las dependencias: se prueba con su python3.14, como haría el instalador.
          - {nombre: Fedora, familia: fedora, imagen: "fedora:latest", python: python3.14, preparar: "dnf install -y python3 python3.14 python3.14-devel gcc portaudio sudo git"}
          - {nombre: Fedora 44, familia: fedora, imagen: "fedora:44", preparar: "dnf install -y python3 python3-pip python3-devel gcc portaudio sudo git"}
          - {nombre: openSUSE, familia: suse, imagen: "opensuse/tumbleweed", preparar: "zypper --non-interactive install python3 python3-pip python3-devel gcc libportaudio2 sudo git"}
    env:
      LINA_FAMILIA_ESPERADA: ${{ matrix.familia }}
    steps:
      - name: Preparar el sistema
        run: ${{ matrix.preparar }}
      - uses: actions/checkout@v4
      - name: Instalar
        run: ${{ matrix.python || 'python3' }} -m venv /tmp/v && /tmp/v/bin/pip install --require-hashes -r packaging/requisitos.txt && /tmp/v/bin/pip install -e ".[dev]"
      - name: Pruebas
        run: /tmp/v/bin/pytest

  python-nuevo:
    name: Python más nuevo (informativo)
    runs-on: ubuntu-latest
    # No bloquea: avisa de cuándo se pueden instalar las dependencias fijadas con el Python que viene, para ampliar el rango 3.11–3.14
    # (install.sh, lina doctor y scripts/fijar_dependencias.sh).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Instalar (fijadas)
        run: pip install --require-hashes -r packaging/requisitos.txt && pip install -e ".[dev]"
      - name: Pruebas
        run: pytest

  flotantes:
    name: Dependencias más recientes (informativo)
    runs-on: ubuntu-latest
    # No bloquea: avisa de que una versión nueva de faster-whisper, piper-tts… rompería Lina ANTES de fijarla en packaging/requisitos.txt.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Instalar (sin fijar)
        run: pip install --upgrade -e ".[dev]"
      - name: Pruebas
        run: pytest
