repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: rastros
        name: secretos y datos personales
        entry: python scripts/comprobar_rastros.py
        language: system
        pass_filenames: false
        always_run: true
