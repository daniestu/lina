# Wikis de juegos en las que Lina busca sin clave (búsqueda de MediaWiki), cuando la consulta nombra el juego.
# api: la dirección de api.php sin «https://» ni «/api.php». pagina: lo que va delante del título de la página.
# es / en: la wiki en cada idioma; se prueba primero la del idioma de Lina y, si no da nada, la otra.
# Todas comprobadas a mano (responden a la búsqueda sin clave). Para añadir una: que sea MediaWiki y que responda a
#   https://<api>/api.php?action=query&list=search&srsearch=prueba&format=json

