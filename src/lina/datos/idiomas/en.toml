"Todavía no he aprendido ninguna receta: cuando algo que me pidas salga bien, lo apunto para hacerlo más rápido la próxima vez." = "I have not learned any recipe yet: when something you ask goes well, I note it to do it faster next time."
"Recetas aprendidas ({n}). Las marcadas con * se repiten sin llamar a la IA:" = "Learned recipes ({n}). Those marked with * are repeated without calling the AI:"
