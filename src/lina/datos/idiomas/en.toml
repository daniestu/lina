"desde que acabas de hablar hasta que suena" = "from when you stop talking until it sounds"
"La fase más lenta: {fase}." = "The slowest phase: {fase}."
"Uso:  lina tiempos [N]   (resume las últimas N peticiones; por defecto 50)" = "Usage:  lina tiempos [N]   (summarises the last N requests; 50 by default)"
"Todavía no hay tiempos medidos. Habla con Lina un rato y vuelve a probar. (Se guardan solo números, nunca lo que dices; se desactiva con:  lina config poner privacidad.registrar_tiempos no)" = "No timings measured yet. Talk to Lina for a while and try again. (Only numbers are stored, never what you say; turn it off with:  lina config poner privacidad.registrar_tiempos no)"
"Se guardan solo números en {archivo}; lo borras con:  lina olvidar tiempos" = "Only numbers are stored in {archivo}; delete them with:  lina olvidar tiempos"
"true: se apuntan cuántos segundos tarda cada fase de una petición (solo números, nunca lo que dices). Se ven con:  lina tiempos" = "true: the seconds each phase of a request takes are noted (numbers only, never what you say). See them with:  lina tiempos"
"las mediciones de tiempo de las peticiones (solo números)" = "the timing measurements of your requests (numbers only)"
