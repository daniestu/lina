"true: la voz de Piper se mantiene cargada en un proceso aparte (se cierra sola tras 10 minutos sin hablar) y las frases salen sin la espera de cargarla cada vez; si falla, se usa el método de siempre. Ocupa algo de memoria mientras está cargada." = "true: Piper's voice stays loaded in a separate process (it closes by itself after 10 minutes without speaking) and phrases come out without the wait of loading it each time; if it fails, the usual method is used. It takes some memory while loaded."
