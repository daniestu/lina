"Si algo no está claro, se lo dejo a la IA. Se apagan con:  lina config poner directas.activo no" = "If something is unclear I leave it to the AI. Turn them off with:  lina config poner directas.activo no"
"true: las órdenes claras y de riesgo bajo («abre Firefox», «sube el volumen») se hacen sin llamar a la IA, mucho más rápido. Mira cuáles y pruébalas con:  lina directas" = "true: clear, low-risk commands («open Firefox», «volume up») are done without calling the AI, much faster. See which ones and try them with:  lina directas"
