"Esto necesita tu confirmación: {motivo}. ¿Lo hago?" = "This needs your confirmation: {motivo}. Shall I do it?"
"true: lo que ya me has pedido una vez y salió bien (p. ej. «desactiva la cámara») lo aprendo y, si lo repites con las mismas palabras, lo hago sin llamar a la IA. Mira lo aprendido con:  lina recetas" = "true: what you have already asked me once and went well (e.g. «desactiva la cámara») I learn, and if you repeat it with the same words I do it without calling the AI. See what I have learned with:  lina recetas"
"Uso:  lina recetas probar \"desactiva la cámara\"" = "Usage:  lina recetas probar \"desactiva la cámara\""
"«{frase}»: la receta {id} («{ajuste}») la repetiría sin llamar a la IA, con {n} paso(s)." = "«{frase}»: recipe {id} («{ajuste}») would repeat it without calling the AI, in {n} step(s)."
"y comprueba con:  {comando}" = "and checks with:  {comando}"
"«{frase}»: no hay ninguna receta fiable para esa frase tal cual; se la dejo a la IA." = "«{frase}»: there is no reliable recipe for that exact phrase; I leave it to the AI."
"Uso:  lina recetas borrar r0001   |   lina recetas borrar todas" = "Usage:  lina recetas borrar r0001   |   lina recetas borrar todas"
