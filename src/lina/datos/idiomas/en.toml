"  ✔ No hay versión nueva (o no he podido consultarlo)." = "  ✔ There is no new version (or I couldn't check)."
"  ! Vuelto, pero fallaron las dependencias: repite  pip install -e " = "  ! Went back, but the dependencies failed: repeat  pip install -e "
"  ! Actualizada, pero fallaron las dependencias. Repite:  pip install -e " = "  ! Updated, but the dependencies failed. Repeat:  pip install -e "
"Se instaló con pip. ¿Ejecuto pip install --upgrade " = "It was installed with pip. Shall I run pip install --upgrade "
"lina config                           muestra todos los ajustes y su valor\nlina config ver SECCION.AJUSTE        un ajuste, con su explicación\nlina config poner SECCION.AJUSTE VALOR   cambia un ajuste (se aplica solo, sin reiniciar)\nlina config perfil [autonomo|equilibrado|prudente]   muestra o cambia el perfil de autonomía\nlina config comprobar                 revisa el archivo y dice qué está mal\nlina config ruta                      dónde está el archivo\nLos ajustes de nombre, voz, manos libres e interfaz se aplican al momento; algunos (voz, nombre) piden reiniciar:  systemctl --user restart lina" = "lina config                           shows all settings and their value\nlina config ver SECTION.SETTING        one setting, with its explanation\nlina config poner SECTION.SETTING VALUE   changes a setting (applies by itself, no restart)\nlina config perfil [autonomo|equilibrado|prudente]   shows or changes the autonomy profile\nlina config comprobar                 checks the file and says what is wrong\nlina config ruta                      where the file is\nName, voice, hands-free and interface settings apply immediately; some (voice, name) ask for a restart:  systemctl --user restart lina"
