"Modelo para el día a día. Vacío: el que recomienda Lina (con «openai» hay que indicarlo; los ves con:  lina ia modelos)." = "Model for everyday use. Empty: the one Lina recommends (with «openai» you must specify it; see them with:  lina ia modelos)."
