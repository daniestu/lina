"El manos libres está activado. Me llamo {nombre}, y mientras juegas no escucho." = "Hands-free mode is on. My name is {nombre}, and I do not listen while you play."
"El manos libres está activado. Me llamo {nombre}, y te escucho también jugando." = "Hands-free mode is on. My name is {nombre}, and I listen while you play too."
