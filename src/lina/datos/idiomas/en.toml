"lina privilegios                  qué permisos de administrador tiene Lina ahora\nlina privilegios instalar         permite a Lina instalar paquetes sin contraseña (solo eso). Antes enseña todo lo que escribirá\nlina privilegios total            sudo sin contraseña para todo (nivel total, con aviso)\nlina privilegios quitar           quita todo lo anterior\nLas tres últimas piden tu contraseña de administrador al sistema (sudo/pkexec): Lina nunca la ve." = "lina privilegios                  what administrator permissions Lina has now\nlina privilegios instalar         lets Lina install packages without a password (only that). First shows everything it will write\nlina privilegios total            passwordless sudo for everything (full level, with a warning)\nlina privilegios quitar           removes all of the above\nThe last three ask the system for your administrator password (sudo/pkexec): Lina never sees it."
"AVISO: el nivel total es el más peligroso.\nCon él, cualquier programa que se ejecute como tú (Lina, o un fallo suyo, una página web que la engañe, un programa malicioso) podrá hacer CUALQUIER\ncosa en este equipo como administrador, sin pedirte nada: borrar el sistema, leer todo, instalar programas. Lina seguirá confirmando con el atajo lo crítico,\npero esa protección es del propio programa, no del sistema.\nEl nivel «instalar» ya cubre lo habitual (instalar paquetes). Usa el total solo si sabes por qué lo quieres." = "WARNING: the full level is the most dangerous.\nWith it, any program that runs as you (Lina, a bug in her, a web page that tricks her, a malicious program) will be able to do ANYTHING\non this computer as administrator, without asking you: wipe the system, read everything, install programs. Lina will keep confirming critical things with the shortcut,\nbut that protection belongs to the program itself, not to the system.\nThe «instalar» level already covers the usual (installing packages). Use full only if you know why you want it."
