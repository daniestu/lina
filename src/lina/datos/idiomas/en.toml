"lina ia                                  con qué IA habla Lina ahora y si está lista\nlina ia usar PROVEEDOR [opciones]        cambia de proveedor: gemini · anthropic · openai (OpenAI y compatibles)\n    --modelo NOMBRE       modelo para el día a día\n    --profundo NOMBRE     modelo para el modo «a fondo»\n    --url DIRECCION       solo openai: servidor propio o local, p. ej. http://localhost:11434/v1\n    --razonamiento        solo openai: el modelo es de razonamiento\nlina ia volver                           vuelve a Gemini con los modelos de siempre\nlina ia modelos                          los modelos que ofrece el servicio ahora configurado\nlina ia probar                           hace una petición de prueba y dice si responde, si usa herramientas y si ve imágenes\nLa clave de cada proveedor se guarda con:  lina clave gemini | anthropic | openai" = "lina ia                                  which AI Lina talks to now and whether it is ready\nlina ia usar PROVIDER [options]          switches provider: gemini · anthropic · openai (OpenAI and compatibles)\n    --modelo NAME         model for everyday use\n    --profundo NAME       model for the «in depth» mode\n    --url ADDRESS         openai only: your own or local server, e.g. http://localhost:11434/v1\n    --razonamiento        openai only: the model is a reasoning one\nlina ia volver                           goes back to Gemini with the usual models\nlina ia modelos                          the models offered by the currently configured service\nlina ia probar                           makes a test request and says whether it responds, uses tools and sees images\nEach provider's key is saved with:  lina clave gemini | anthropic | openai"
"lina preparar [--simular] [--si] [--sin-modelos] [--sin-servicio] [--sin-atajo] [--atajo TECLA] [--entrada]\n    Deja Lina lista para usarse: enlace del comando, modelos (Whisper y voz), servicio de usuario y atajo global.\n    --simular      dice lo que haría, sin tocar nada\n    --si           responde «sí» a las preguntas (menos a las de permisos de administrador, que siempre se hacen a mano)\n    --entrada      además prepara el control de programas con la pantalla (permisos de /dev/uinput; pide administrador)\nlina uninstall [--simular] [--si] [--todo]\n    Quita lo que instaló Lina (servicio, atajo, comando, permisos). --todo borra también tus ajustes, claves y datos." = "lina preparar [--simular] [--si] [--sin-modelos] [--sin-servicio] [--sin-atajo] [--atajo KEY] [--entrada]\n    Gets Lina ready to use: command link, models (Whisper and voice), user service and global shortcut.\n    --simular      says what it would do, touching nothing\n    --si           answers «yes» to the questions (except the administrator-permission ones, which are always done by hand)\n    --entrada      also prepares controlling programs through the screen (/dev/uinput permissions; asks for administrator)\nlina uninstall [--simular] [--si] [--todo]\n    Removes what Lina installed (service, shortcut, command, permissions). --todo also deletes your settings, keys and data."
