"Eso no lo hago: formatear discos, borrar particiones o el sistema entero está bloqueado en mi código, ni siquiera con tu confirmación. Si de verdad quieres reinstalar o vaciar un disco, hazlo tú desde un USB de instalación o con el gestor de particiones. Si lo que buscas es liberar espacio o volver a un punto anterior, dímelo y lo vemos con una copia o limpiando cachés." = "I will not do that: formatting disks, deleting partitions or wiping the whole system is blocked in my code, even with your confirmation. If you really want to reinstall or wipe a disk, do it yourself from an installation USB or with the partition manager. If what you want is to free up space or go back to an earlier point, tell me and we will sort it out with a backup or by clearing caches."
"Lina {version}: asistente de voz para el escritorio Linux.\n\n  lina                       arranca a Lina (lo normal es que lo haga sola el servicio de usuario)\n  lina pulsar                equivale a pulsar el atajo (hablar / terminar de hablar / callarla). Ponlo en el atajo de teclado\n  lina config [ORDEN]        ver y cambiar los ajustes (nombre, voz, perfil de autonomía, gasto…):  lina config ayuda\n  lina voz [NOMBRE]          lista las voces o elige una (la descarga si hace falta)\n  lina clave [gemini|pago|openai|anthropic|NOMBRE]   guarda una clave (de la IA, de pago, de un servidor MCP…) en el llavero del sistema, sin que se vea ni se dicte\n  lina ia [ORDEN]            con qué IA habla Lina (Gemini, Anthropic, OpenAI y compatibles) y cómo cambiarla:  lina ia ayuda\n  lina privilegios [instalar|total|quitar]   qué permisos de administrador tiene Lina y cómo dárselos o quitárselos (siempre tras enseñarte lo que se escribe)\n  lina privacidad [si|no]    qué se envía a la IA y qué no, y si permites enviar capturas de tu pantalla\n  lina olvidar [QUÉ]         borra lo que Lina guarda de ti: diario, registro de acciones, recetas, tiempos, registro del sistema (antes enseña qué y cuánto)\n  lina directas [probar F]   las órdenes que Lina hace sin llamar a la IA (abrir un programa, volumen…); «probar» dice qué haría con una frase\n  lina recetas [probar F|borrar ID]   lo que Lina ha aprendido a hacer y repite sin llamar a la IA; «probar» dice qué haría con una frase\n  lina tiempos [N]           en qué fase se va el tiempo de tus últimas N peticiones (solo números, nada de lo que dices)\n  lina manos-libres ORDEN    probar \"frase\" · eco · nivel   (ajustes del manos libres)\n  lina indicador probar      enseña el resplandor de escucha\n  lina interfaz ORDEN        diagnostico · preparar · estado   (control de programas con la pantalla)\n  lina sistema               qué distribución, gestor de paquetes y escritorio detecta\n  lina preparar              (lo hace install.sh) comando, modelos, servicio y atajo; --simular dice lo que haría sin tocar nada\n  lina escritorio            qué escritorio detecta y qué puede hacer Lina en él (ventana activa, captura de pantalla, portapapeles)\n  lina update [--comprobar]  actualiza Lina (te enseña qué trae y pregunta); --volver deshace la última actualización\n  lina doctor [--red]        comprueba la instalación y dice cómo arreglar lo que falle; --informe lo da sin datos personales\n  lina bienvenida            te guía para dejar a Lina lista: clave de Gemini, micrófono, nombre, autonomía y privacidad\n  lina modelos [estado]      descarga (o dice si están) el modelo de voz a texto y la voz de Lina\n  lina atajo [TECLA]         crea el atajo de teclado global para hablar con Lina (KDE y GNOME)\n  lina uninstall [--todo]    quita lo que instaló Lina; --todo también tus ajustes, claves y datos\n  lina mcp [--config]        servidor MCP de Lina para otras IAs\n  lina --version\n" = "Lina {version}: voice assistant for the Linux desktop.\n\n  lina                       starts Lina (normally the user service does this for you)\n  lina pulsar                same as pressing the shortcut (talk / finish talking / silence her). Put it on your keyboard shortcut\n  lina config [COMMAND]      view and change settings (name, voice, autonomy profile, spending…):  lina config ayuda\n  lina voz [NAME]            lists the voices or picks one (downloads it if needed)\n  lina clave [gemini|pago|openai|anthropic|NAME]   saves a key (for the AI, a paid one, an MCP server…) in the system keyring, without it being shown or dictated\n  lina ia [COMMAND]          which AI Lina talks to (Gemini, Anthropic, OpenAI and compatible) and how to change it:  lina ia ayuda\n  lina privilegios [instalar|total|quitar]   what administrator permissions Lina has and how to give or take them away (always after showing you what gets written)\n  lina privacidad [si|no]    what is sent to the AI and what is not, and whether you allow sending screenshots\n  lina olvidar [WHAT]        deletes what Lina keeps about you: journal, action log, recipes, timings, system log (it first shows what and how much)\n  lina directas [probar F]   the commands Lina does without calling the AI (open a program, volume…); «probar» says what it would do with a phrase\n  lina recetas [probar F|borrar ID]   what Lina has learned to do and repeats without calling the AI; «probar» says what it would do with a phrase\n  lina tiempos [N]           shows which phase your last N requests spent their time in (numbers only, nothing you said)\n  lina manos-libres COMMAND  probar \"phrase\" · eco · nivel   (hands-free settings)\n  lina indicador probar      shows the listening glow\n  lina interfaz COMMAND      diagnostico · preparar · estado   (controlling programs through the screen)\n  lina sistema               which distribution, package manager and desktop it detects\n  lina preparar              (install.sh does this) command, models, service and shortcut; --simular says what it would do without touching anything\n  lina escritorio            which desktop it detects and what Lina can do on it (active window, screenshot, clipboard)\n  lina update [--comprobar]  updates Lina (shows what is new and asks); --volver undoes the last update\n  lina doctor [--red]        checks the installation and says how to fix what fails; --informe gives it without personal data\n  lina bienvenida            guides you to get Lina ready: Gemini key, microphone, name, autonomy and privacy\n  lina modelos [estado]      downloads (or says whether you have) the speech-to-text model and Lina's voice\n  lina atajo [KEY]           creates the global keyboard shortcut to talk to Lina (KDE and GNOME)\n  lina uninstall [--todo]    removes what Lina installed; --todo also your settings, keys and data\n  lina mcp [--config]        Lina's MCP server for other AIs\n  lina --version\n"
