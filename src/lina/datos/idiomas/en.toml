# English translations of the texts Lina says or shows. Key: the Spanish text; value: the translation (same {placeholders}).
# Texts not listed here appear in Spanish.

"Vale: sigo con la clave de pago hasta {tope} este mes (llevas {gasto}). El mes que viene vuelve a ser de {base}." = "Okay: I keep using the paid key up to {tope} this month (you have spent {gasto}). Next month the cap goes back to {base}."
"No hay clave de pago configurada (añádela con:  lina clave pago): no hay ningún gasto que topar." = "There is no paid key set up (add it with:  lina clave pago), so there is no spending to cap."
"Subir el tope de gasto solo lo hago si pulsas el atajo y me lo dices tú. Con «Oye Lina» no, por si lo dijera otra voz." = "I only raise the spending cap if you press the hotkey and tell me yourself. Not with \"Hey Lina\", in case another voice said it."
"Por seguridad solo cambio el tope por voz entre 1 y {maximo} euros. Si quieres otra cifra, edita {archivo}." = "For safety I only change the cap by voice between 1 and {maximo} euros. If you want another figure, edit {archivo}."
"Vale, pero ya llevas {gasto}: con un tope de {tope} sigo usando solo la clave gratuita." = "Okay, but you have already spent {gasto}: with a cap of {tope} I keep using only the free key."
"Gasto de Gemini" = "Gemini spending"
"He llegado al tope de gasto de este mes ({tope}). A partir de ahora uso solo la clave gratuita. Si quieres seguir con la de pago, dime «sigue con el de pago hasta {nuevo} euros»." = "I have reached this month's spending cap ({tope}). From now on I use only the free key. If you want to carry on with the paid one, tell me \"carry on with the paid one up to {nuevo} euros\"."
"Aviso: llevas el {u} % del tope de gasto de este mes ({gasto} de {tope})." = "Notice: you have used {u} % of this month's spending cap ({gasto} of {tope})."
"Ojo: llevas el {u} % del tope de gasto de este mes ({gasto} de {tope})." = "Careful: you have used {u} % of this month's spending cap ({gasto} of {tope})."
