"  Lina necesita una «clave de API» de Gemini. Es como una contraseña que le deja usar la inteligencia artificial de Google para entenderte\n  y responderte. Es gratuita (no pide tarjeta) y la creas tú ahora mismo:\n\n    1) Abre esta página:  {ENLACE_CLAVE}\n       (en la mayoría de terminales, Ctrl+clic sobre el enlace la abre)\n    2) Entra con tu cuenta de Google.\n    3) Pulsa el botón para crear la clave («Crear clave de API», en inglés «Create API key»).\n       Si te pide elegir un proyecto, vale cualquiera.\n    4) Te sale un texto largo de letras y números (suele empezar por «AIza» o «AQ.»). Cópialo y pégalo aquí abajo con Ctrl+Mayús+V.\n       Al pegarlo no se ve nada: es normal. Pulsa Intro." = "  Lina needs a Gemini «API key». It's like a password that lets Lina use Google's artificial intelligence to understand and answer you.\n  It's free (no card needed) and you create it yourself right now:\n\n    1) Open this page:  {ENLACE_CLAVE}\n       (in most terminals, Ctrl+click on the link opens it)\n    2) Sign in with your Google account.\n    3) Click the button to create the key («Create API key»).\n       If it asks you to pick a project, any will do.\n    4) A long text of letters and numbers (usually starting with «AIza» or «AQ.») appears. Copy it and paste it below with Ctrl+Shift+V.\n       Nothing is shown when you paste: that's normal. Press Enter."
"  Clave de Gemini (el texto largo que has copiado; Intro para saltar este paso): " = "  Gemini key (the long text you copied; press Enter to skip this step): "
"  Recibida ({n} caracteres). Compruebo que funciona…" = "  Received ({n} characters). Checking that it works…"
"  ! Eso no parece una clave de Gemini (es un texto largo, sin espacios): ¿has copiado la clave entera? La compruebo igualmente." = "  ! That doesn't look like a Gemini key (it's one long text, without spaces): did you copy the whole key? I'll check it anyway."
"La clave gratuita de Gemini se crea en https://aistudio.google.com/apikey: entra con tu cuenta de Google y pulsa «Crear clave de API» (en inglés «Create API key»). Es un texto largo de letras y números (suele empezar por «AIza» o «AQ.»)." = "The free Gemini key is created at https://aistudio.google.com/apikey: sign in with your Google account and click «Create API key». It's a long text of letters and numbers (usually starting with «AIza» or «AQ.»)."
"Pega aquí la {nombre} (no se ve nada al pegar; pulsa Intro): " = "Paste the {nombre} here (nothing is shown when you paste; press Enter): "

"  No he conseguido guardar una clave que funcione. Cuando la tengas:  lina clave gemini" = "  I couldn't save a working key. When you have one:  lina clave gemini"
"Google dice que esa clave no es válida (código {codigo}: {motivo})" = "Google says that key is not valid (code {codigo}: {motivo})"
"Google dice que esa clave no es válida (código {codigo})" = "Google says that key is not valid (code {codigo})"
"He añadido {v1} al PATH en {archivo}: vale en las terminales nuevas (en esta, escribe  {v2}  o ábrela otra vez)." = "I added {v1} to your PATH in {archivo}: it works in new terminals (in this one, type  {v2}  or reopen it)."
"línea de PATH en {archivo}" = "PATH line in {archivo}"
"{ruta} ya no existe" = "{ruta} no longer exists"
"quitada la línea de PATH de {ruta}" = "removed the PATH line from {ruta}"
"Guardada {nombre} en {detalle}. He reiniciado a Lina para que la use." = "Saved {nombre} in {detalle}. I restarted Lina so she uses it."
"  ✔ He reiniciado a Lina para que use la clave." = "  ✔ I restarted Lina so she uses the key."
"falta gtk-layer-shell (o GTK3): sin él el resplandor sale como ventanas normales" = "gtk-layer-shell (or GTK3) is missing: without it the glow shows up as ordinary windows"
"TUS CLAVES guardadas en el llavero del sistema" = "YOUR KEYS stored in the system keyring"
"claves quitadas del llavero: {v1}" = "keys removed from the keyring: {v1}"
"ninguna" = "none"
"\nDe momento he dejado TUS AJUSTES, CLAVES y DATOS ({v1}, {v2}, {v3}) por si vuelves a instalar a Lina." = "\nFor now I have left YOUR SETTINGS, KEYS and DATA ({v1}, {v2}, {v3}) in case you install Lina again."
"¿Los borro también? Se pierden tus claves, ajustes, voces y modelos, y no se puede deshacer." = "Delete them as well? Your keys, settings, voices and models are lost, and this cannot be undone."
"cancelación de eco y limpieza del micrófono ({v1})" = "echo cancellation and microphone clean-up ({v1})"
"quitada la configuración de audio de Lina (el audio se reinicia un momento)" = "removed Lina's audio configuration (audio restarts for a moment)"
"Atajo {tecla} registrado en KDE. KDE lo activa cuando cierres sesión y vuelvas a entrar." = "Shortcut {tecla} registered in KDE. KDE activates it when you log out and back in."
"  Tu atajo {tecla} se activa cuando cierres sesión y vuelvas a entrar (KDE no lo carga antes). Hasta entonces, di «Oye {v1}»." = "  Your {tecla} shortcut is activated when you log out and back in (KDE does not load it earlier). Until then, say «Hey {v1}»."
"  Si algo no va:  lina doctor" = "  If something is wrong:  lina doctor"
"Tu atajo {tecla} todavía no funciona: KDE lo activa cuando cierres sesión y vuelvas a entrar. Hasta entonces, dime «Oye {nombre}»." = "Your {tecla} shortcut doesn't work yet: KDE activates it when you log out and back in. Until then, just say «Hey {nombre}»."
"Cierra sesión para activar el atajo" = "Log out to activate the shortcut"
"  ! Tu micrófono llega al máximo ({barra}): se satura, suena demasiado alto y con ruido, y así no te entiendo bien." = "  ! Your microphone hits the maximum ({barra}): it clips, sounds too loud and noisy, and I can't understand you well like that."
"  Bájale el volumen de entrada en los ajustes de sonido, o usa unos auriculares con micrófono; y repite luego con:  lina bienvenida" = "  Turn its input volume down in the sound settings, or use a headset with a microphone; then repeat with:  lina bienvenida"
"  Le bajo la ganancia al {porcentaje} %. Di otra frase en voz normal (2 segundos)…" = "  I'm lowering the gain to {porcentaje} %. Say another sentence in a normal voice (2 seconds)…"
"  ✔ Ahora se oye bien: {barra}. He dejado la ganancia al {porcentaje} %." = "  ✔ It sounds fine now: {barra}. I left the gain at {porcentaje} %."
"  Sigue saturando aunque lo bajo: he dejado la ganancia como estaba. Prueba unos auriculares con micrófono o un micrófono USB, y repite con:  lina bienvenida" = "  It still clips even when I lower it: I left the gain as it was. Try a headset with a microphone or a USB microphone, then repeat with:  lina bienvenida"
"decisiones previas del código" = "the code's earlier decisions"
