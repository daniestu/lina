[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lina-asistente"
version = "0.1.0.dev0"
description = "Lina: asistente de voz en español para el escritorio Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Natural Language :: Spanish",
    "Topic :: Desktop Environment",
]
dependencies = [
    "numpy",
    "sounddevice",
    "faster-whisper",
    "requests",
    "pillow",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "piper-tts",
    "evdev; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "coverage>=7.10", "ruff", "mypy", "pre-commit", "types-requests"]

[project.scripts]
lina = "lina.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lina = ["datos/*", "datos/ayuda/*", "datos/privilegios/*", "datos/idiomas/*", "escritorio/interfaz.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# F: errores de programación (nombres sin definir, imports sin usar…); B006/B007/B023: trampas de Python; PLE y W6: errores seguros
select = ["E9", "F", "B006", "B007", "B023", "PLE", "W6"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841", "F811", "F821", "B007"]

[tool.coverage.run]
source = ["src/lina"]
branch = false
parallel = true
patch = ["subprocess"]        # varias pruebas lanzan Lina como proceso aparte (tests/suites): se cuentan también

[tool.coverage.report]
show_missing = false
fail_under = 63               # la CI mide 67 %; esto impide que baje sin que se note (subirlo cuando suba)
skip_empty = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
files = ["src/lina"]
ignore_missing_imports = true      # evdev, sounddevice, faster_whisper, piper… no traen tipos
check_untyped_defs = false         # se irá endureciendo módulo a módulo
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

# Los módulos pequeños y limpios se comprueban a fondo desde ya.
[[tool.mypy.overrides]]
module = ["lina.nucleo.registro", "lina.nucleo.procesos", "lina.nucleo.ejecucion", "lina.nucleo.texto", "lina.nucleo.constantes",
          "lina.nucleo.opcionales", "lina.nucleo.declaraciones", "lina.nucleo.rutas", "lina.nucleo.dependencias"]
check_untyped_defs = true
